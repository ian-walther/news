Section "ServerFlags"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Device"
    Identifier "NewspaperDummyDevice"
    Driver "dummy"
    VideoRam 256000
EndSection

Section "Monitor"
    Identifier "NewspaperDummyMonitor"
    HorizSync 30.0-90.0
    VertRefresh 50.0-75.0
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier "NewspaperDummyScreen"
    Device "NewspaperDummyDevice"
    Monitor "NewspaperDummyMonitor"
    DefaultDepth 24

    SubSection "Display"
        Depth 24
        Modes "1920x1080"
        Virtual 1920 1080
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier "NewspaperDummyLayout"
    Screen 0 "NewspaperDummyScreen"
EndSection

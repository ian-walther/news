services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST:-localhost}
      PHX_SCHEME: ${PHX_SCHEME:-http}
      PHX_URL_PORT: ${PHX_URL_PORT:-4000}
      PORT: ${PORT:-4000}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?SECRET_KEY_BASE is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      POOL_SIZE: ${POOL_SIZE:-10}
      NEWSPAPER_HEADED_BROWSER_CDP_URL: ${NEWSPAPER_HEADED_BROWSER_CDP_URL:-http://172.31.254.1:9223}
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    networks:
      - default
      - browser_control
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:$${PORT}/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # OAuth-protected MCP server for AI agents (planning/mcp-news-bridge.md).
  # This is the only service meant to be published outside the LAN. It reads
  # the app's /internal/api/v1 over the compose network and holds no database
  # credentials. Without an Auth0 API for MCP_PUBLIC_URL it refuses every call.
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_healthy
    environment:
      NEWS_API_URL: http://app:${PORT:-4000}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3940"
      MCP_HTTP_PATH: /mcp
      MCP_AUTH_MODE: ${MCP_AUTH_MODE:-oidc}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:?MCP_PUBLIC_URL is required}
      MCP_OIDC_ISSUER: ${MCP_OIDC_ISSUER:-}
      MCP_STATIC_TOKENS: ${MCP_STATIC_TOKENS:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_TRUST_PROXY: "true"
      MCP_HTTP_RESPONSE_MODE: json
      MCP_RESULT_STRUCTURED: ${MCP_RESULT_STRUCTURED:-true}
      LOG_FORMAT: json
    ports:
      - "${MCP_PORT:-3940}:3940"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-newspaper_prod}
    volumes:
      - newspaper_prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-newspaper_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  newspaper_prod_postgres:

networks:
  browser_control:
    external: true
    name: newspaper_browser_control
